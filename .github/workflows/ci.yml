name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psql_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d psql_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Init test database
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d psql_mcp_test -f sql/init_test_db.sql

      - name: Ruff
        run: uv run ruff check src tests

      - name: Unit tests
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/psql_mcp_test
        run: uv run pytest tests/unit -v

      - name: Integration tests
        env:
          TEST_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/psql_mcp_test
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/psql_mcp_test
        run: uv run pytest tests/integration -v -m integration
