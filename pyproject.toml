[project]
name = "psql-mcp"
version = "0.1.0"
description = "Production-grade PostgreSQL MCP server for agentic RAG workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.25.0",
    "psycopg[binary]>=3.3.2",
    "pglast==7.11",
    "psycopg-pool>=3.3.0",
    "pydantic-settings>=2.0",
]

license = "MIT"

[project.scripts]
psql-mcp = "psql_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psql_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/psql_mcp", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["./src"]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a live PostgreSQL instance",
]

[dependency-groups]
dev = [
    "docker>=7.1.0",
    "pyright>=1.1.400",
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "N", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/psql_mcp/sql/safe_sql.py" = ["E501", "UP035", "UP041", "I001", "RUF100"]
